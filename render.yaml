# Stage 9: deploy on Render.
#
# Two ways to use this file, both land on the same settings:
#   * New -> Blueprint in the Render dashboard, pointed at the GitHub repo
#     (Render reads this file from the repository root), or
#   * New -> Web Service on the repo, filling these same fields by hand.
#
# Free tier: the instance spins down after 15 minutes without inbound traffic,
# and spinning back up takes about a minute (Render shows a loading page
# meanwhile). That is why healthCheckPath exists - Render probes /health so it
# can tell "asleep" from "broken", and it is also the URL to check when a
# deploy claims success.
services:
  - type: web
    name: cureconnect
    runtime: python
    plan: free
    # Deploy on every push to main. `autoDeployTrigger` is the current name
    # for this; the older `autoDeploy: true` still works but is deprecated.
    # Use 'off' to deploy by hand instead.
    autoDeployTrigger: commit
    # Render pins the interpreter through the PYTHON_VERSION environment
    # variable (or a .python-version file - there is no `pythonVersion` key in
    # the blueprint spec). 3.14.8 is Render's current default for new
    # services, and it is the version the pins in requirements.txt were
    # checked against.
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health